name: Napiwnik APK

on:
  push:
    branches: [napiwnik-flutter]
    paths:
      - "napiwnik/**"
      - ".github/workflows/napiwnik-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: napiwnik
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Wygeneruj folder android/ bez ruszania naszego kodu
        run: |
          cp -r lib /tmp/lib_bak
          cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --org pl.napiwnik --project-name napiwnik --platforms=android .
          rm -rf lib test
          cp -r /tmp/lib_bak lib
          cp /tmp/pubspec_bak.yaml pubspec.yaml

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: napiwnik-apk
          path: napiwnik/build/app/outputs/flutter-apk/app-release.apk
